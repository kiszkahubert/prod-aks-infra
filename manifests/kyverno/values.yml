admissionController:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  serviceMonitor:
    enabled: false

backgroundController:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 30m, memory: 64Mi }
    limits: { cpu: 150m, memory: 128Mi }

#Settings to save resources on poor clusters
cleanupController:
  enabled: false

reportsController:
  enabled: false

webhooksCleanup:
  enabled: true

config:
  webhooks:
    failurePolicy: Fail # If kyverno is down then pods wont be created in whole cluster
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno

crds:
  install: true

features:
  autoUpdateWebhooks: 
    enabled: true
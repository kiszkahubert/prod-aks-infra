apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-web
  namespace: workloads
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["web-a", "web-b"]
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: web-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
#Sync private key from Key Vault to native k8s Secret used by ArgoCD as repository credentials
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: argocd-github-deploy-key
  namespace: argocd
spec:
  provider: azure
  secretObjects:
    - secretName: argocd-gitops-repo-creds
      type: Opaque
      labels:
        argocd.argoproj.io/secret-type: repository
      data:
        - objectName: argocd-github-deploy-key
          key: sshPrivateKey
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<AKS_KV_CSI_CLIENT_ID>"
    keyvaultName: "<KV_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: argocd-github-deploy-key
          objectType: secret

---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitops-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: "git@github.com:<GITHUB_ORG>/<GITOPS_REPO>.git"

---
apiVersion: v1
kind: Pod
metadata:
  name: kv-sync-trigger
  namespace: argocd
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: sync
      image: mcr.microsoft.com/oss/kubernetes/pause:3.9
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      volumeMounts:
        - name: secrets
          mountPath: "/mnt/secrets"
          readOnly: true
  volumes:
    - name: secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: argocd-github-deploy-key
  restartPolicy: Never
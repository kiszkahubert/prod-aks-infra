#Sync private key from Key Vault to native k8s Secret used by ArgoCD as repository credentials
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: argocd-github-deploy-key
  namespace: argocd
spec:
  provider: azure
  secretObjects:
    - secretName: argocd-gitops-repo-creds
      type: Opaque
      labels:
        argocd.argoproj.io/secret-type: repository
      data:
        - objectName: argocd-github-deploy-key
          key: sshPrivateKey
        - objectName: argocd-repo-type
          key: type
        - objectName: argocd-repo-url
          key: url
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "ebd8a290-ac43-462d-8523-fc4717ab6f99"
    keyvaultName: "kv-dev-weu-01-xssg"
    tenantId: "5e101ffa-c098-4fab-b44b-ea4c60bd3e3b"
    objects: |
      array:
        - |
          objectName: argocd-github-deploy-key
          objectType: secret
        - |
          objectName: argocd-repo-type
          objectType: secret
        - |
          objectName: argocd-repo-url
          objectType: secret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-kv-sync
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-kv-sync
  template:
    metadata:
      labels:
        app: argocd-kv-sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: mcr.microsoft.com/oss/kubernetes/pause:3.9
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true

      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: argocd-github-deploy-key
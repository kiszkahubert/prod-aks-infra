apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "git@github.com:kiszkahubert/prod-aks-infra.git"
    targetRevision: main
    path: apps
    directory:
      include: "{namespaces,network-policies,kyverno,kyverno-policies,workloads,gateway,envoy-gateway-repo,envoy-gateway-crds,envoy-gateway}.yml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false